<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ident — Remnant · Motion Lab</title>
<style>
  :root{
    --paper:#f4f1ea;
    --ink:#0a0a0a;
    --red:#e0362c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#05060a;overflow:hidden}
  body{
    font-family:"Helvetica Neue",Helvetica,Arial,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------------- scène 1080×1080 ---------------- */
  #stage{
    position:fixed;left:50%;top:50%;
    width:1080px;height:1080px;
    transform-origin:50% 50%;
    background:var(--paper);
    color:var(--ink);
    overflow:hidden;
  }
  #stage > *{position:absolute}

  /* grille visible */
  #grid{
    inset:0;
    background-image:
      linear-gradient(to right, rgba(10,10,10,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(10,10,10,.055) 1px, transparent 1px);
    background-size:90px 90px;
  }

  /* ---------------- beat 1 : carré + barres ---------------- */
  #s1{inset:0;opacity:0}
  #sq{
    left:150px;top:190px;width:300px;height:300px;
    background:var(--ink);
    will-change:transform,opacity;
  }
  #barA{
    left:520px;top:220px;width:380px;height:26px;
    background:var(--red);
    will-change:transform,opacity;
  }
  #barB{
    left:900px;top:430px;width:26px;height:280px;
    background:var(--red);
    will-change:transform,opacity;
  }

  /* ---------------- beat 2 : disque + triangle ---------------- */
  #s2{inset:0;opacity:0}
  #disc{
    left:230px;top:170px;width:620px;height:620px;
    border:36px solid var(--ink);
    border-radius:50%;
    will-change:transform,opacity;
  }
  #discDot{
    left:492px;top:432px;width:96px;height:96px;
    background:var(--red);border-radius:50%;
    will-change:transform,opacity;
  }
  #tri{
    width:0;height:0;
    left:146px;top:752px;
    border-left:130px solid transparent;
    border-right:130px solid transparent;
    border-bottom:224px solid var(--ink);
    will-change:transform,opacity;
  }

  /* ---------------- beat 3 : le mot ---------------- */
  #s3{inset:0;opacity:0}
  #word{
    left:0;right:0;top:322px;height:250px;
    display:flex;align-items:center;justify-content:center;
    font-size:188px;font-weight:900;line-height:1;
    letter-spacing:.02em;color:var(--ink);
  }
  .lt{position:relative;display:inline-block;will-change:transform,opacity}
  .lt .ch{position:relative;z-index:1;font:inherit;font-weight:inherit}
  .lt .sh{
    position:absolute;left:50%;top:50%;
    width:.84em;height:.84em;
    margin:0;background:var(--red);
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
  }
  .lt .sh.cir{border-radius:50%}
  .lt .sh.tri{clip-path:polygon(50% 0%,100% 100%,0% 100%)}

  /* ---------------- beat 4 : filet + baseline ---------------- */
  #s4{inset:0;opacity:0}
  #rule{
    left:240px;top:628px;height:6px;width:0;
    background:var(--ink);
    will-change:width;
  }
  #baseline{
    left:0;right:0;top:668px;
    text-align:center;
    font-size:42px;font-weight:700;
    letter-spacing:.46em;text-indent:.46em;
    text-transform:uppercase;color:var(--ink);
    will-change:transform,opacity;
  }

  /* ---------------- chrome ---------------- */
  #prog{
    left:0;right:0;bottom:0;height:6px;
    background:rgba(10,10,10,.10);
  }
  #progbar{display:block;height:100%;width:0;background:var(--red)}

  #controls{
    top:36px;right:36px;
    display:flex;gap:12px;
  }
  .ctl{
    appearance:none;cursor:pointer;
    font-family:inherit;font-size:21px;font-weight:800;
    letter-spacing:.16em;text-transform:uppercase;
    padding:11px 20px;
    color:var(--ink);background:transparent;
    border:3px solid var(--ink);border-radius:0;
    transition:background .2s ease,color .2s ease,border-color .2s ease;
  }
  .ctl:hover{background:rgba(10,10,10,.08)}
  .ctl.on{background:var(--red);border-color:var(--red);color:#fff}
  .ctl:focus-visible{outline:3px solid var(--red);outline-offset:3px}

  #hint{
    left:0;right:0;bottom:40px;text-align:center;
    font-size:20px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:rgba(10,10,10,.5);
    opacity:0;transition:opacity .6s ease;
  }
  #hint.show{opacity:1}
  #hint.hide{opacity:0}

  /* ---------------- écran d'accueil ---------------- */
  #overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:#0a0a0a;color:var(--paper);
    transition:opacity .45s ease;
    padding:24px;
  }
  #overlay.hide{opacity:0;pointer-events:none}
  .ov-card{
    border:4px solid var(--paper);
    padding:44px 56px 40px;text-align:center;max-width:640px;
  }
  .ov-mark{
    font-size:14px;font-weight:800;letter-spacing:.52em;
    text-transform:uppercase;color:var(--red);
  }
  .ov-card h1{
    margin:20px 0 0;font-size:clamp(26px,4.6vw,46px);
    font-weight:900;letter-spacing:-.01em;line-height:1.05;
  }
  .ov-card p{
    margin:18px 0 0;font-size:15px;line-height:1.75;
    letter-spacing:.05em;color:rgba(244,241,234,.62);
  }
  #startBtn{
    appearance:none;cursor:pointer;
    margin-top:30px;padding:17px 42px;
    font-family:inherit;font-size:16px;font-weight:800;
    letter-spacing:.24em;text-transform:uppercase;
    color:#fff;background:var(--red);border:0;border-radius:0;
    transition:filter .2s ease;
  }
  #startBtn:hover{filter:brightness(1.08)}
  #startBtn:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
</style>
</head>
<body>

<div id="stage">
  <div id="grid"></div>

  <div id="s1">
    <div id="sq"></div>
    <div id="barA"></div>
    <div id="barB"></div>
  </div>

  <div id="s2">
    <div id="disc"></div>
    <div id="discDot"></div>
    <div id="tri"></div>
  </div>

  <div id="s3"><div id="word"></div></div>

  <div id="s4">
    <div id="rule"></div>
    <div id="baseline">Motion Lab</div>
  </div>

  <div id="hint">Espace : pause · S : son · V : voix · R : recommencer</div>
  <div id="controls">
    <button id="btnSound" class="ctl" type="button" aria-pressed="false">Son</button>
    <button id="btnVoice" class="ctl" type="button" aria-pressed="false">Voix</button>
  </div>
  <div id="prog"><span id="progbar"></span></div>
</div>

<div id="overlay">
  <div class="ov-card">
    <div class="ov-mark">Remnant · Motion Lab</div>
    <h1>Ident — Remnant</h1>
    <p>Carré 1:1 · 12 secondes · en boucle<br />Son et voix désactivés par défaut</p>
    <button id="startBtn" type="button">Démarrer</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var DURATION = 12;
  window.MOTION = { id: "ident-remnant", title: "Ident — Remnant", duration: DURATION, aspect: "1:1" };

  /* ================================================================== *
   * utilitaires
   * ================================================================== */
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
  function lerp(a, b, x) { return a + (b - a) * x; }
  function smoothstep(a, b, x) {
    if (b === a) return x < a ? 0 : 1;
    var v = clamp((x - a) / (b - a), 0, 1);
    return v * v * (3 - 2 * v);
  }
  function easeOutCubic(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function easeInOutCubic(x) {
    x = clamp(x, 0, 1);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }
  function easeOutBack(x) {
    x = clamp(x, 0, 1);
    var c = 1.70158;
    return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
  }

  var stage = document.getElementById("stage");
  function fit() {
    var k = Math.min(window.innerWidth / 1080, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%,-50%) scale(" + k + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  /* ================================================================== *
   * SON — Web Audio, entièrement synthétisé (aucun fichier audio)
   * ================================================================== */
  var AudioCtxClass = window.AudioContext || window.webkitAudioContext;
  var actx = null, master = null, ambient = null;
  var soundOn = false;

  function createAudio() {
    if (actx || !AudioCtxClass) return actx;
    try {
      actx = new AudioCtxClass();
      master = actx.createGain();
      master.gain.value = 0.85;
      master.connect(actx.destination);
    } catch (e) { actx = null; master = null; }
    return actx;
  }

  function noiseBuffer(seconds) {
    if (!actx) return null;
    try {
      var len = Math.max(1, Math.floor(actx.sampleRate * seconds));
      var buf = actx.createBuffer(1, len, actx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    } catch (e) { return null; }
  }

  function envNode(gainNode, t0, attack, decay, peak) {
    var g = gainNode.gain;
    var a = Math.max(0.002, attack), d = Math.max(0.01, decay);
    g.cancelScheduledValues(t0);
    g.setValueAtTime(0.0001, t0);
    g.exponentialRampToValueAtTime(Math.max(0.0005, peak), t0 + a);
    g.exponentialRampToValueAtTime(0.0001, t0 + a + d);
  }

  var sfx = {
    tick: function () {
      if (!soundOn || !actx) return;
      try {
        var t0 = actx.currentTime;
        var o = actx.createOscillator();
        o.type = "square";
        o.frequency.setValueAtTime(1600, t0);
        o.frequency.exponentialRampToValueAtTime(880, t0 + 0.05);
        var g = actx.createGain();
        envNode(g, t0, 0.003, 0.06, 0.09);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + 0.12);
      } catch (e) {}
    },
    blip: function (freq) {
      if (!soundOn || !actx) return;
      try {
        var t0 = actx.currentTime;
        var o = actx.createOscillator();
        o.type = "triangle";
        o.frequency.setValueAtTime(freq, t0);
        o.frequency.exponentialRampToValueAtTime(freq * 1.6, t0 + 0.09);
        var g = actx.createGain();
        envNode(g, t0, 0.004, 0.13, 0.09);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + 0.24);
      } catch (e) {}
    },
    impact: function (gain) {
      if (!soundOn || !actx) return;
      try {
        var t0 = actx.currentTime;
        var amp = 0.5 * (gain || 1);
        var o = actx.createOscillator();
        o.type = "sine";
        o.frequency.setValueAtTime(150, t0);
        o.frequency.exponentialRampToValueAtTime(46, t0 + 0.35);
        var g = actx.createGain();
        envNode(g, t0, 0.006, 0.5, amp);
        o.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + 0.68);

        var buf = noiseBuffer(0.3);
        if (!buf) return;
        var src = actx.createBufferSource();
        src.buffer = buf;
        var f = actx.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.setValueAtTime(2600, t0);
        f.frequency.exponentialRampToValueAtTime(400, t0 + 0.25);
        var g2 = actx.createGain();
        envNode(g2, t0, 0.004, 0.22, amp * 0.5);
        src.connect(f); f.connect(g2); g2.connect(master);
        src.start(t0); src.stop(t0 + 0.34);
      } catch (e) {}
    },
    whoosh: function (dur, gain) {
      if (!soundOn || !actx) return;
      try {
        var t0 = actx.currentTime;
        var d = Math.max(0.15, dur || 0.5);
        var buf = noiseBuffer(d + 0.1);
        if (!buf) return;
        var src = actx.createBufferSource();
        src.buffer = buf;
        var f = actx.createBiquadFilter();
        f.type = "bandpass"; f.Q.value = 1.1;
        f.frequency.setValueAtTime(260, t0);
        f.frequency.exponentialRampToValueAtTime(3200, t0 + d * 0.8);
        f.frequency.exponentialRampToValueAtTime(700, t0 + d);
        var g = actx.createGain();
        envNode(g, t0, d * 0.35, d * 0.6, 0.15 * (gain || 1));
        src.connect(f); f.connect(g); g.connect(master);
        src.start(t0); src.stop(t0 + d + 0.06);
      } catch (e) {}
    },
    riser: function (dur) {
      if (!soundOn || !actx) return;
      try {
        var t0 = actx.currentTime;
        var d = Math.max(0.2, dur || 0.8);
        var o = actx.createOscillator();
        o.type = "sawtooth";
        o.frequency.setValueAtTime(110, t0);
        o.frequency.exponentialRampToValueAtTime(880, t0 + d);
        var f = actx.createBiquadFilter();
        f.type = "lowpass";
        f.frequency.setValueAtTime(600, t0);
        f.frequency.exponentialRampToValueAtTime(4200, t0 + d);
        var g = actx.createGain();
        g.setValueAtTime(0.0001, t0);
        g.exponentialRampToValueAtTime(0.085, t0 + d);
        g.exponentialRampToValueAtTime(0.0001, t0 + d + 0.08);
        o.connect(f); f.connect(g); g.connect(master);
        o.start(t0); o.stop(t0 + d + 0.14);
      } catch (e) {}
    }
  };

  function startAmbient() {
    if (!actx || ambient) return;
    try {
      var g = actx.createGain();
      g.gain.value = 0.0001;
      var f = actx.createBiquadFilter();
      f.type = "lowpass"; f.frequency.value = 420;

      var o1 = actx.createOscillator();
      o1.type = "sine"; o1.frequency.value = 55;
      var o2 = actx.createOscillator();
      o2.type = "triangle"; o2.frequency.value = 82.5;
      var o2g = actx.createGain();
      o2g.gain.value = 0.32;

      var lfo = actx.createOscillator();
      lfo.type = "sine"; lfo.frequency.value = 0.85;
      var lfoGain = actx.createGain();
      lfoGain.gain.value = 0.018;

      o1.connect(g);
      o2.connect(o2g); o2g.connect(g);
      g.connect(f); f.connect(master);
      lfo.connect(lfoGain); lfoGain.connect(g.gain);

      var t0 = actx.currentTime;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.05, t0 + 1.4);

      o1.start(); o2.start(); lfo.start();
      ambient = { g: g, o1: o1, o2: o2, lfo: lfo };
    } catch (e) { ambient = null; }
  }

  function stopAmbient() {
    if (!ambient || !actx) return;
    var n = ambient;
    ambient = null;
    try {
      var t0 = actx.currentTime;
      n.g.gain.cancelScheduledValues(t0);
      n.g.gain.setValueAtTime(Math.max(0.0001, n.g.gain.value), t0);
      n.g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
      n.o1.stop(t0 + 0.45);
      n.o2.stop(t0 + 0.45);
      n.lfo.stop(t0 + 0.45);
    } catch (e) {}
  }

  var btnSound = document.getElementById("btnSound");
  function setSound(on) {
    soundOn = !!on;
    btnSound.classList.toggle("on", soundOn);
    btnSound.setAttribute("aria-pressed", soundOn ? "true" : "false");
    if (soundOn) {
      createAudio();
      if (actx) {
        if (actx.state === "suspended" && typeof actx.resume === "function") {
          var p = actx.resume();
          if (p && typeof p.catch === "function") p.catch(function () {});
        }
        startAmbient();
      }
    } else {
      stopAmbient();
      if (actx && actx.state === "running" && typeof actx.suspend === "function") {
        try { actx.suspend(); } catch (e) {}
      }
    }
  }

  /* ================================================================== *
   * VOIX — speechSynthesis (dégrade en silence si indisponible)
   * ================================================================== */
  var speech = null;
  try {
    if (typeof window !== "undefined" && "speechSynthesis" in window) speech = window.speechSynthesis;
  } catch (e) { speech = null; }

  var voiceOn = false, chosenVoice = null, voiceBeat = -1;
  var btnVoice = document.getElementById("btnVoice");

  function refreshVoices() {
    if (!speech || typeof speech.getVoices !== "function") return;
    try {
      var list = speech.getVoices() || [];
      for (var i = 0; i < list.length; i++) {
        var v = list[i];
        if (v && typeof v.lang === "string" && v.lang.toLowerCase().indexOf("fr") === 0) {
          chosenVoice = v;
          return;
        }
      }
    } catch (e) { chosenVoice = null; }
  }

  try {
    if (speech && typeof speech.addEventListener === "function") {
      speech.addEventListener("voiceschanged", refreshVoices);
    } else if (speech && "onvoiceschanged" in speech) {
      speech.onvoiceschanged = refreshVoices;
    }
  } catch (e) {}
  refreshVoices();

  function speak(text) {
    if (!voiceOn || !speech || !text) return;
    if (typeof window.SpeechSynthesisUtterance !== "function") return;
    try {
      speech.cancel();
      var u = new window.SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.rate = 1.02;
      u.pitch = 1.0;
      u.volume = 1.0;
      if (chosenVoice) u.voice = chosenVoice;
      speech.speak(u);
    } catch (e) {}
  }

  function stopSpeech() {
    if (!speech) return;
    try { speech.cancel(); } catch (e) {}
  }

  function setVoice(on) {
    voiceOn = !!on;
    btnVoice.classList.toggle("on", voiceOn);
    btnVoice.setAttribute("aria-pressed", voiceOn ? "true" : "false");
    if (voiceOn) { refreshVoices(); voiceBeat = -1; }
    else { stopSpeech(); }
  }

  var VOICE_LINES = [
    { t: 0.25, text: "Remnant." },
    { t: 2.75, text: "Motion Lab." },
    { t: 6.25, text: "Des images qui bougent, des récits qui marquent." }
  ];

  function updateVoice(t) {
    if (!voiceOn || !playing) return;
    var idx = -1;
    for (var i = 0; i < VOICE_LINES.length; i++) {
      if (t >= VOICE_LINES[i].t) idx = i;
    }
    if (idx !== voiceBeat) {
      voiceBeat = idx;
      if (idx >= 0) speak(VOICE_LINES[idx].text);
    }
  }

  /* ================================================================== *
   * structure du mot
   * ================================================================== */
  var SHAPES = ["sq", "cir", "tri", "sq", "cir", "tri", "sq"];
  var wordEl = document.getElementById("word");
  var letters = [];
  "REMNANT".split("").forEach(function (ch, i) {
    var lt = document.createElement("span");
    lt.className = "lt";
    var sh = document.createElement("i");
    sh.className = "sh " + SHAPES[i % SHAPES.length];
    var c = document.createElement("b");
    c.className = "ch";
    c.textContent = ch;
    lt.appendChild(sh);
    lt.appendChild(c);
    wordEl.appendChild(lt);
    letters.push({ el: lt, shape: sh });
  });

  var els = {
    s1: document.getElementById("s1"),
    s2: document.getElementById("s2"),
    s3: document.getElementById("s3"),
    s4: document.getElementById("s4"),
    sq: document.getElementById("sq"),
    barA: document.getElementById("barA"),
    barB: document.getElementById("barB"),
    disc: document.getElementById("disc"),
    discDot: document.getElementById("discDot"),
    tri: document.getElementById("tri"),
    rule: document.getElementById("rule"),
    baseline: document.getElementById("baseline"),
    progbar: document.getElementById("progbar"),
    hint: document.getElementById("hint")
  };

  /* ================================================================== *
   * scènes
   * ================================================================== */
  var SCENES = [
    { el: els.s1, start: 0.00, end: 2.90, fin: 0.25, fout: 0.50 },
    { el: els.s2, start: 2.60, end: 6.30, fin: 0.40, fout: 0.40 },
    { el: els.s3, start: 6.00, end: 12.00, fin: 0.35, fout: 0.80 },
    { el: els.s4, start: 9.20, end: 12.00, fin: 0.40, fout: 0.80 }
  ];

  function sceneAlpha(scene, t) {
    var a = smoothstep(scene.start, scene.start + scene.fin, t);
    var b = 1 - smoothstep(scene.end - scene.fout, scene.end, t);
    return Math.min(a, b);
  }

  /* ================================================================== *
   * repères sonores (uniquement pendant la lecture, une fois par passage)
   * ================================================================== */
  var CUES = [
    { t: 0.05, f: function () { sfx.whoosh(0.55, 0.5); } },
    { t: 0.52, f: function () { sfx.impact(0.9); } },
    { t: 0.95, f: function () { sfx.whoosh(0.32, 0.35); } },
    { t: 1.18, f: function () { sfx.tick(); } },
    { t: 1.38, f: function () { sfx.whoosh(0.30, 0.32); } },
    { t: 1.60, f: function () { sfx.tick(); } },
    { t: 2.55, f: function () { sfx.riser(0.9); } },
    { t: 3.45, f: function () { sfx.impact(1.0); } },
    { t: 3.95, f: function () { sfx.blip(320); } },
    { t: 4.50, f: function () { sfx.blip(240); } },
    { t: 6.10, f: function () { sfx.impact(0.7); } },
    { t: 6.30, f: function () { sfx.blip(660); } },
    { t: 6.46, f: function () { sfx.blip(740); } },
    { t: 6.62, f: function () { sfx.blip(830); } },
    { t: 6.78, f: function () { sfx.blip(920); } },
    { t: 6.94, f: function () { sfx.blip(1010); } },
    { t: 7.10, f: function () { sfx.blip(1100); } },
    { t: 7.26, f: function () { sfx.blip(1200); } },
    { t: 9.30, f: function () { sfx.riser(0.5); } },
    { t: 9.90, f: function () { sfx.impact(0.8); } },
    { t: 11.30, f: function () { sfx.whoosh(0.7, 0.28); } }
  ];
  var cueIdx = 0;

  function fireCues(prev, cur) {
    if (cur < prev) cueIdx = 0; // la timeline vient de boucler
    while (cueIdx < CUES.length && CUES[cueIdx].t <= cur) {
      CUES[cueIdx].f();
      cueIdx++;
    }
  }

  /* ================================================================== *
   * rendu déterministe
   * ================================================================== */
  function render(t) {
    for (var s = 0; s < SCENES.length; s++) {
      SCENES[s].el.style.opacity = sceneAlpha(SCENES[s], t);
    }

    /* --- beat 1 : carré + barres --- */
    var p1 = clamp((t - 0.10) / 0.55, 0, 1);
    var e1 = easeOutCubic(p1);
    els.sq.style.opacity = clamp(p1 * 3, 0, 1);
    els.sq.style.transform =
      "translate(" + lerp(-1500, 0, e1).toFixed(2) + "px," + lerp(-520, 0, e1).toFixed(2) + "px) " +
      "rotate(" + lerp(-22, 0, e1).toFixed(3) + "deg) scale(" + lerp(1.25, 1, e1).toFixed(4) + ")";

    var pA = clamp((t - 0.95) / 0.45, 0, 1);
    var eA = easeOutCubic(pA);
    els.barA.style.opacity = pA;
    els.barA.style.transform = "translateX(" + lerp(1000, 0, eA).toFixed(2) + "px)";

    var pB = clamp((t - 1.35) / 0.45, 0, 1);
    var eB = easeOutCubic(pB);
    els.barB.style.opacity = pB;
    els.barB.style.transform = "translateY(" + lerp(900, 0, eB).toFixed(2) + "px)";

    /* --- beat 2 : disque + triangle --- */
    var p2 = clamp((t - 2.75) / 0.70, 0, 1);
    var e2 = easeOutCubic(p2);
    var spin = p2 > 0 ? lerp(-160, 0, e2) + (t > 3.45 ? (t - 3.45) * 11 : 0) : -160;
    els.disc.style.opacity = clamp(p2 * 2.2, 0, 1);
    els.disc.style.transform = "rotate(" + spin.toFixed(2) + "deg) scale(" + lerp(0.55, 1, e2).toFixed(4) + ")";
    els.discDot.style.opacity = clamp(p2 * 2.2, 0, 1);
    els.discDot.style.transform = "scale(" + lerp(0.4, 1, easeOutBack(p2)).toFixed(4) + ")";

    var p3 = clamp((t - 3.90) / 0.60, 0, 1);
    var e3 = easeOutCubic(p3);
    els.tri.style.opacity = clamp(p3 * 2, 0, 1);
    els.tri.style.transform =
      "translateY(" + lerp(120, 0, e3).toFixed(2) + "px) rotate(" + lerp(120, 0, easeOutBack(p3)).toFixed(2) + "deg)";

    /* --- beat 3 : le mot, lettre par lettre, chacune issue d'une forme --- */
    for (var i = 0; i < letters.length; i++) {
      var st = 6.15 + i * 0.16;
      var p = clamp((t - st) / 0.50, 0, 1);
      var e = easeOutBack(p);
      var L = letters[i];
      L.el.style.opacity = clamp(p * 1.8, 0, 1);
      L.el.style.transform =
        "translateY(" + lerp(70, 0, e).toFixed(2) + "px) " +
        "scale(" + lerp(0.40, 1, e).toFixed(4) + ") " +
        "rotate(" + lerp(-14, 0, e).toFixed(3) + "deg)";
      /* la forme rouge s'efface quand la lettre se pose */
      var sq = 1 - clamp(p * 1.5, 0, 1);
      L.shape.style.opacity = sq.toFixed(3);
      L.shape.style.transform =
        "translate(-50%,-50%) rotate(" + lerp(-40, 25, e).toFixed(2) + "deg) scale(" + lerp(1.18, 0.55, e).toFixed(4) + ")";
    }

    /* --- beat 4 : filet + baseline --- */
    var pr = clamp((t - 9.35) / 0.55, 0, 1);
    els.rule.style.width = (easeInOutCubic(pr) * 600).toFixed(1) + "px";
    var pb = smoothstep(9.60, 10.10, t);
    els.baseline.style.opacity = pb;
    els.baseline.style.transform = "translateY(" + lerp(22, 0, pb).toFixed(2) + "px)";

    /* --- chrome --- */
    els.progbar.style.width = (clamp(t / DURATION, 0, 1) * 100).toFixed(3) + "%";
  }

  /* ================================================================== *
   * boucle + contrôles
   * ================================================================== */
  var started = false, playing = false;
  var elapsed = 0, last = 0;

  function loop(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.25) dt = 0.25; // onglet en arrière-plan : on ne saute pas
    var prev = elapsed;
    if (playing) {
      elapsed += dt;
      if (elapsed >= DURATION) elapsed -= DURATION;
      fireCues(prev, elapsed);
    }
    render(elapsed);
    updateVoice(elapsed);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function setPlaying(v) {
    playing = !!v;
    if (!playing) {
      stopSpeech();
      voiceBeat = -1;
    }
    els.hint.classList.toggle("hide", !playing);
  }

  function restart() {
    elapsed = 0;
    last = 0;
    cueIdx = 0;
    voiceBeat = -1;
    stopSpeech();
    setPlaying(true);
  }

  var overlay = document.getElementById("overlay");
  function start() {
    if (started) return;
    started = true;
    createAudio(); // créé dans le geste utilisateur (exigence des navigateurs)
    setSound(soundOn); // son coupé : le contexte reste suspendu, aucun CPU gaspillé
    overlay.classList.add("hide");
    setPlaying(true);
    els.hint.classList.add("show");
    window.setTimeout(function () { els.hint.classList.add("hide"); }, 3000);
  }
  document.getElementById("startBtn").addEventListener("click", start);

  document.getElementById("btnSound").addEventListener("click", function (e) {
    e.stopPropagation();
    setSound(!soundOn);
  });
  document.getElementById("btnVoice").addEventListener("click", function (e) {
    e.stopPropagation();
    setVoice(!voiceOn);
  });

  window.addEventListener("keydown", function (event) {
    if (event.code === "Space" || event.key === " ") {
      event.preventDefault();
      if (!started) { start(); return; }
      setPlaying(!playing);
    } else if (event.key === "r" || event.key === "R") {
      event.preventDefault();
      if (!started) { start(); return; }
      restart();
    } else if (event.key === "s" || event.key === "S") {
      event.preventDefault();
      setSound(!soundOn);
    } else if (event.key === "v" || event.key === "V") {
      event.preventDefault();
      setVoice(!voiceOn);
    }
  });

  stage.addEventListener("click", function (event) {
    var target = event.target;
    if (target && target.closest && target.closest("button")) return;
    if (!started) return;
    setPlaying(!playing);
  });
})();
</script>
</body>
</html>
